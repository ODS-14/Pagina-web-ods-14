<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido | ODS 14</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style-sesion.css') }}">
</head>
<body>
    <!-- NAVBAR -->
    <div class="navbar-fija">
        <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="{{ url_for('home') }}">ODS 14</a>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-white">
                        Hola, {{ usuario }}
                    </span>
                    <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">
                        Cerrar sesión
                    </a>
                </div>
            </div>
        </nav>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenedor-sesion">
        <div class="tarjeta-sesion">
            <div class="icono-mar">
                <span>🌊</span>
            </div>
            <h1>¡Bienvenido, {{ usuario }}!</h1>
            <p class="subtitulo">
                Iniciaste sesión correctamente en nuestra página del ODS 14.
            </p>
            <p>
                Gracias por interesarte en el cuidado de los océanos,
                los mares y la vida submarina.
            </p>
            <a href="{{ url_for('logout') }}" class="btn btn-primary mt-3">
                Cerrar sesión
            </a>
        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <div class="footer">
        <h3>ODS-14</h3>
        <h3>4to Año</h3>
        <h3>2026</h3>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
